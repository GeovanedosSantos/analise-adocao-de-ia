<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <title>Adoção de IA</title>
    <!-- Aplica o tema antes de pintar a página (sem piscar): escolha salva ou, sem escolha, o tema do sistema -->
    <script>
      (function () {
        var escolha = null
        try { escolha = localStorage.getItem('tema') } catch (e) {}
        var escuro = escolha === 'escuro' || (escolha !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = escuro ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
