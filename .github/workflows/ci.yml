name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prontidao
          POSTGRES_USER: prontidao
          POSTGRES_PASSWORD: prontidao-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prontidao" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: prontidao
      POSTGRES_USER: prontidao
      POSTGRES_PASSWORD: prontidao-ci
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Pango para o WeasyPrint
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
      - run: pip install -r requirements.txt pip-audit
      - name: Migrações em dia
        run: python manage.py makemigrations --check --dry-run
      - name: Testes
        run: python manage.py test --noinput
      - name: Desempenho das rotas síncronas e do PDF (RNF05, RNF09)
        run: |
          python manage.py migrate --noinput
          python manage.py criar_dados_exemplo --senha "ci-$(date +%s)"
          python manage.py medir_desempenho --repeticoes 20
      - name: Dependências vulneráveis
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependências vulneráveis
        run: npm audit --audit-level=high
