{% load i18n %}
{% comment %}
  Mesmo botão do Django (o admin/js/theme.js alterna auto → claro → escuro pelas classes abaixo),
  com ícones de traço iguais aos do site no lugar dos ícones com quadrado de fundo.
{% endcomment %}
<button class="theme-toggle" type="button">
  <span class="visually-hidden theme-label-when-auto">{% translate 'Toggle theme (current theme: auto)' %}</span>
  <span class="visually-hidden theme-label-when-light">{% translate 'Toggle theme (current theme: light)' %}</span>
  <span class="visually-hidden theme-label-when-dark">{% translate 'Toggle theme (current theme: dark)' %}</span>
  <svg aria-hidden="true" class="theme-icon-when-auto painel-icone-tema" viewBox="0 0 24 24">
    <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
  </svg>
  <svg aria-hidden="true" class="theme-icon-when-dark painel-icone-tema" viewBox="0 0 24 24">
    <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
  </svg>
  <svg aria-hidden="true" class="theme-icon-when-light painel-icone-tema" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
  </svg>
</button>
